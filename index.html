<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 서울 with 양띵</title>
<style>
:root{--bg:#FBF6EC;--card:#FFFDF8;--ink:#4A3B2A;--sub:#8A7660;--line:#E8DCC6;
--a:#CFE3BC;--ab:#F1F7E8;--ad:#5F7F45;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A241B;--card:#352E23;--ink:#F1E8D8;--sub:#BCAA90;--line:#4B4233}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
body{min-height:100vh}
body.d2{--a:#EBD3B3;--ab:#FBF1E3;--ad:#9A6B3C}
@media(prefers-color-scheme:dark){body:not(.d2){--ab:#35402B}body.d2{--ab:#44382A}}
#leaves span{position:fixed;top:-8vh;pointer-events:none;z-index:1;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#leaves{display:none}}
#open{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.ticket{width:100%;max-width:380px;background:var(--card);border:2px dashed #C9B58F;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 6px 20px #8a6b3c22}
.ticket small{letter-spacing:.2em;color:var(--sub);font-size:11px}
.ticket h1{font-size:22px;margin:10px 0 4px}
.route{font-size:15px;color:var(--sub);margin-bottom:14px}
.cd{background:#F1F7E8;color:#4F6B3A;border-radius:14px;padding:12px 8px;margin:14px 0}
.cd b{display:block;font-size:26px}.cd span{font-size:12px}
.btns{display:flex;gap:12px;justify-content:center;min-height:50px}
.btns button{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:999px;padding:12px 26px;cursor:pointer}
#yes{background:#8DB36B;color:#fff;max-width:100%;transition:font-size .25s,padding .25s}#no{background:#E9D8BF;color:#6B5238;z-index:5}
#app{display:none;position:relative;z-index:2;max-width:560px;margin:0 auto;padding:18px 14px 60px}
header{text-align:center;margin-bottom:12px}
header h2{margin:0;font-size:21px}header p{margin:4px 0 0;color:var(--sub);font-size:13px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer}
.tabs button.on{background:var(--a);border-color:var(--ad);color:var(--ad)}
body.d2 .tabs button.on{color:#7A5230}
.warn{background:#FFE9D6;border:2px solid #F2B889;color:#8A4B1E;border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.5}
.warn b{font-size:15px}
.tl{position:relative;padding-left:14px;border-left:3px dotted var(--ad)}
.it{position:relative;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--a);border-radius:16px;padding:11px 12px;margin:0 0 10px;display:flex;gap:10px;align-items:flex-start}
.it:before{content:"";position:absolute;left:-25px;top:18px;width:11px;height:11px;border-radius:50%;background:var(--ad)}
.it.sub{background:var(--ab);padding:8px 12px}.it.sub .t{opacity:.6}
.t{width:62px;flex:none;font-size:12px;font-weight:700;color:var(--ad);padding-top:3px}
.em{font-size:24px;line-height:1}
.mid{flex:1;min-width:0}.ti{font-weight:700;font-size:15px}
.bub{display:inline-block;margin-top:5px;background:var(--ab);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:3px 10px;font-size:12px;color:var(--sub)}
.map{display:inline-block;margin:6px 6px 0 0;font-size:12px;font-weight:700;color:var(--ad);text-decoration:none;background:var(--ab);border-radius:999px;padding:4px 10px}
.gauge{margin-top:8px;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#B7D79A,#E9A35E,#D9663A);transition:width 1.6s}
.gl{font-size:11px;color:var(--sub);margin-top:3px}
.vote{display:flex;gap:8px;margin-top:8px}
.vote button{flex:1;font:inherit;font-size:13px;font-weight:700;background:var(--ab);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}
.vote button.me{border-color:var(--ad);background:var(--a)}
.end{cursor:pointer;background:var(--a);text-align:center;display:block;border-radius:18px;padding:16px;margin-top:16px;font-weight:700}
.end p{margin:8px 0 0;font-weight:400;font-size:14px}
</style>
</head>
<body>
<div id="leaves"></div>
<section id="open">
 <div class="ticket">
  <small>SEOUL AUTUMN TRIP · BEST FRIENDS</small>
  <h1>🎫 양띵, 서울 갈 준비 됐어?</h1>
  <div class="route">🍂 유하 &amp; 양띵 · 11.20.(금) 15:00 만나!</div>
  <div class="cd"><span id="dd">D-?</span><b id="clock">--</b><span>만나는 시간까지</span></div>
  <div class="btns"><button id="yes">예! 🍁</button><button id="no">아니오</button></div>
 </div>
</section>
<main id="app">
 <header><h2>🍁 2026 서울 with 양띵 🍂</h2><p>추진 일정 · 눌러보면 지도가 열려요</p></header>
 <div class="tabs"><button class="on" data-d="1">🍂 11.20 (금)</button><button data-d="2">🌰 11.21 (토)</button></div>
 <div id="warn"></div>
 <div class="tl" id="tl"></div>
 <div id="endbox"></div>
</main>
<script>
const R=[
[1,"15:00","💼","유하 퇴근","늦어질수도ㅠ"],
[1,"15:10","💕","만나!"],
[1,"~","🚇","이동","신분당선"],
[1,"15:40","🌯","치폴레","백퍼 웨이팅","https://map.naver.com/p/entry/place/2025451379?placePath=%2Fhome","w"],
[1,"~","🍽️","이른 저녁"],
[1,"16:30-17:00","🛍️","shopping","zara & 뉴뉴"],
[1,"~","🚇","이동"],
[1,"17:20","🎄","압로 갤러리아","트리 사진!","https://naver.me/FCA8esAN"],
[1,"~","👀","구경"],
[1,"18:00","🍻","술 start","막차는 타야대"],
[1,"~","🥂","n차","야탑역"],
[2,"10:00","⏰","기상","되도록"],
[2,"~11:00","💄","예뻐지기"],
[2,"~","🚇","이동"],
[2,"12:10","🍲","한정선 웨이팅","","https://naver.me/F9N46G4y","w"],
[2,"~","🥣","해장","in 성수"],
[2,"13:30","🎀","샤넬 팝업","","https://naver.me/5aj5Duqq"],
[2,"~16:30","🛍️","shopping2","브멜 & 섭듀드"],
[2,"~17:30","☕","카페","성수 or 서울숲","","v"],
[2,"17:50","🍙","식물원김밥","Pick up","https://naver.me/x7ewsv74"],
[2,"18:10","🚉","수서역 출발","수인분당선 20m"]
];
const W={1:'<b>🚨 막차는 타야대!</b><br>술 start 18:00 → n차는 야탑역. 막차 시간 꼭 확인하기',2:'<b>🚨 18:10 수서역 출발 → 19:00 양띵 기차</b><br>수인분당선으로 20분 걸려요'};
const $=s=>document.querySelector(s);
const mp=q=>q;
let votes={},mine=null,uid=null,db=null;
try{mine=localStorage.getItem('vote')}catch(e){}
function voteHtml(){const c={성수:0,서울숲:0};Object.values(votes).forEach(v=>c[v]!==undefined&&c[v]++);
 return ['성수','서울숲'].map(k=>`<button data-k="${k}" class="${mine===k?'me':''}">${k==='성수'?'☕':'🌳'} ${k} · ${c[k]}표</button>`).join('')}
function render(d){
 $('#warn').innerHTML='<div class="warn">'+W[d]+'</div>';
 $('#tl').innerHTML=R.filter(r=>r[0]==d).map(r=>{
  const[,t,e,ti,n,m,x]=r;
  let h=`<div class="it ${t==='~'?'sub':''}"><div class="t">${t}</div><div class="em">${e}</div><div class="mid"><div class="ti">${ti}</div>`;
  if(n)h+=`<span class="bub">💬 ${n}</span>`;
  if(m)h+=`<br><a class="map" target="_blank" rel="noopener" href="${mp(m)}">📍 지도</a>`;
  if(x==='w')h+=`<div class="gauge"><i data-w="100"></i></div><div class="gl">웨이팅 각오 100% 🔥</div>`;
  if(x==='v')h+=`<div class="vote" id="vote">${voteHtml()}</div>`;
  return h+'</div></div>'}).join('');
 setTimeout(()=>document.querySelectorAll('.gauge i').forEach(i=>i.style.width=i.dataset.w+'%'),80);
 $('#endbox').innerHTML=d==2?'<div class="end" id="end">🚄 양띵 기차 · 벌써 아숩ㅜ<p>(눌러봐 💌)</p></div>':'';
}
function setDay(d){document.body.classList.toggle('d2',d==2);document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.d==d));render(d)}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b)setDay(+b.dataset.d)};
document.addEventListener('click',e=>{
 const v=e.target.closest('.vote button');
 if(v){mine=v.dataset.k;try{localStorage.setItem('vote',mine)}catch(x){}votes[uid||'me']=mine;
  if(db&&uid)db.collection('votes').doc(uid).set({pick:mine}).catch(()=>{});
  $('#vote').innerHTML=voteHtml()}
 if(e.target.closest('#end')){$('#end').innerHTML='🎫 다음 여행 예약하기 💌<p>다음엔 어디 갈까? 🧳 우리 또 가자, 양띵! 🍁</p>';leaves(30,true)}
});
/* 오프닝 */
const no=$('#no'),pool=['아니오','놉! 🙈','못 눌러~','🏃💨','예 눌러 😝'];let n=0;
function dodge(e){e.preventDefault();no.style.position='fixed';
 no.style.left=Math.max(10,Math.random()*(innerWidth-no.offsetWidth-20))+'px';
 no.style.top=Math.max(10,Math.random()*(innerHeight-no.offsetHeight-20))+'px';no.textContent=pool[++n%pool.length];const y=$('#yes');y.style.fontSize=Math.min(16+n*3,48)+'px';y.style.padding=Math.min(12+n*2,40)+'px '+Math.min(26+n*5,70)+'px'}
['pointerenter','pointerdown','click'].forEach(t=>no.addEventListener(t,dodge));
$('#yes').onclick=()=>{$('#open').style.display='none';$('#app').style.display='block';setDay(1);scrollTo(0,0)};
const T=new Date('2026-11-20T15:00:00+09:00').getTime(),kd=t=>Math.floor((t+324e5)/864e5);
function tick(){const now=Date.now(),df=T-now;
 if(df<=0){$('#dd').textContent='D-DAY';$('#clock').textContent='지금 만나는 중 💕';return}
 const D=kd(T)-kd(now),h=Math.floor(df/36e5),m=Math.floor(df%36e5/6e4),s=Math.floor(df%6e4/1e3);
 $('#dd').textContent=D>0?'D-'+D:'D-DAY';$('#clock').textContent=`${h}시간 ${m}분 ${s}초`}
tick();setInterval(tick,1000);
/* 낙엽 */
function leaves(k,burst){const L=$('#leaves'),E=['🍂','🍁','🍂','🍃'];
 for(let i=0;i<k;i++){const s=document.createElement('span');s.textContent=E[i%4];
  s.style.left=Math.random()*100+'vw';s.style.fontSize=(14+Math.random()*16)+'px';
  s.style.animationDuration=(burst?4+Math.random()*3:9+Math.random()*9)+'s';
  s.style.animationDelay=(burst?0:-Math.random()*12)+'s';
  if(burst){s.style.animationIterationCount=1;setTimeout(()=>s.remove(),8000)}
  L.appendChild(s)}}
leaves(14);
/* 공유 투표 (가능한 경우만) */
(async()=>{try{const u=await claude.use('user');db=await claude.use('db');if(!db||!u)return;uid=await u.id();if(!uid)return;
 db.collection('votes').onSnapshot(s=>{votes={};s.docs.forEach(d=>{const p=d.data();if(p&&p.pick)votes[d.id]=p.pick});
  if(votes[uid])mine=votes[uid];const v=$('#vote');if(v)v.innerHTML=voteHtml()},()=>{})}catch(e){}})();
</script>
</body>
</html>
